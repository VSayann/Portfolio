<form style="width: 80%; margin:0 auto; display:flex; flex-direction:column; gap:1rem;">

  <input 
    type="text" 
    name="name" 
    placeholder="Prénom Nom"
    required
    style="padding:0.75rem; border-radius:6px; background-color:#333; color: #ccc;"
  >

  <input 
    type="email" 
    name="email" 
    placeholder="Email"
    required
    style="padding:0.75rem; border-radius:6px; background-color:#333; color: #ccc;"
  >

  <textarea 
    name="message" 
    placeholder="Tapez votre message ici.."
    rows="5"
    required
    style="padding:0.75rem; border-radius:6px; background-color:#333; color: #ccc;"
  ></textarea>

  <button 
    type="submit"
    style="padding:0.75rem; border:none; border-radius:6px; background-color:#333; color:white; cursor:pointer;"
  >
    Envoyer
  </button>

</form>
